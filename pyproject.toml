[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "relight-pipeline"
version = "0.1.0"
description = "Resumable image relighting pipeline powered by Qwen VL"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "aiohttp>=3.10,<4",
    "openai>=1.68,<3",
    "Pillow>=11,<13",
    "tqdm>=4.67,<5",
    "tzdata>=2025.2",
]

[project.optional-dependencies]
oss = ["alibabacloud-oss-v2>=1.3,<2"]
dev = [
    "pytest>=8,<10",
    "pytest-asyncio>=0.24,<2",
]

[project.scripts]
relight-demo = "relight_demo:main"

[tool.setuptools]
py-modules = ["env", "relight_demo"]

[tool.setuptools.packages.find]
include = ["relight*"]
